<div class=" d-flex justify-content-center align-items-center h-100-p">
    <div class="login-box div-width">
        <h1 class="mb-12 title">Change Your Password
        </h1>
        <p class="mb-32 description">Please create a new password.</p>
        <form [formGroup]="passwordFormGroup" autocomplete="off">
            <div class="mb-20">
                <label for="password" class="form-label">Password</label>
                <div class="password-field">
                    <input [type]="isShowPassword ? 'text':'password'" formControlName="password"
                        class="form-control placeholder-text " placeholder="********">
                    <img *ngIf="isShowPassword" (click)="showPassword()" [src]="imgSrc" alt="Toggle Password Visibility"
                        style="cursor: pointer;" />
                    <img *ngIf="!isShowPassword" (click)="showPassword()" [src]="imgSrc"
                        alt="Toggle Password Visibility" style="cursor: pointer;" />
                </div>
                <!-- <ng-container
                    *ngIf=" passwordFormGroup.get('password')!.hasError('required') && (passwordFormGroup.get('password')?.dirty || passwordFormGroup.get('password')?.touched) else invalid">
                    <span class="text-danger error-state">Must be 8 or more characters and contain at least 1
                        number and 1 special character.</span>


                </ng-container>
                <ng-template #invalid>
                    <ng-container
                        *ngIf=" passwordFormGroup.get('password')!.invalid &&  passwordFormGroup.get('password')?.touched">
                        <span class="text-danger error-state">Not a valid Password</span>

                    </ng-container>
                </ng-template> -->
                <ng-container
                    *ngIf=" passwordFormGroup.get('password')!.hasError('required') && (passwordFormGroup.get('password')?.dirty || passwordFormGroup.get('password')?.touched) else invalid">
                    <span class="text-danger error-states">Must be 8 or more characters and
                        contain at least 1
                        number and 1 special character.</span>


                </ng-container>
                <ng-template #invalid>
                    <ng-container
                        *ngIf=" passwordFormGroup.get('password')!.invalid &&  passwordFormGroup.get('password')?.touched">
                        <span class="text-danger error-states">Not a valid Password</span>

                    </ng-container>
                </ng-template>
            </div>
            <div class="mb-24">
                <label for="password" class="form-label">Confirm Password</label>
                <div class="password-field">
                    <input [type]="isShowConfirmPassword ? 'text':'password'" formControlName="confirmPassword"
                        class="form-control placeholder-text " placeholder="********">
                    <img *ngIf="isShowConfirmPassword" (click)="showConfirmPassword()" [src]="imgSrc1"
                        alt="Toggle Password Visibility" style="cursor: pointer;" />
                    <img *ngIf="!isShowConfirmPassword" (click)="showConfirmPassword()" [src]="imgSrc1"
                        alt="Toggle Password Visibility" style="cursor: pointer;" />
                </div>
                <!-- <ng-container
                    *ngIf=" passwordFormGroup.get('confirmPassword')!.hasError('required') && (passwordFormGroup.get('confirmPassword')?.dirty || passwordFormGroup.get('confirmPassword')?.touched)    else checkPass ">
                    <span class="text-danger error-states"> Confirm Passwords is required.</span>

                </ng-container>
                <ng-template #checkPass>
                    <ng-container
                        *ngIf=" passwordFormGroup.get('confirmPassword')!.invalid &&  passwordFormGroup.get('confirmPassword')?.touched">
                        <span class="text-danger error-states">
                            Two passwords that you enter is inconsistent!</span>


                    </ng-container>
                </ng-template> -->
                <ng-container
                    *ngIf=" passwordFormGroup.get('confirmPassword')!.hasError('required') && (passwordFormGroup.get('confirmPassword')?.dirty || passwordFormGroup.get('confirmPassword')?.touched)    else checkPass ">
                    <span class="text-danger error-states"> Confirm Passwords is
                        required.</span>

                </ng-container>
                <ng-template #checkPass>
                    <ng-container
                        *ngIf=" passwordFormGroup.get('confirmPassword')!.invalid &&  passwordFormGroup.get('confirmPassword')?.touched">
                        <span class="text-danger error-states">
                            Two passwords that you enter is inconsistent!</span>


                    </ng-container>
                </ng-template>
            </div>

            <div class="d-flex gap-4 group-wrapper mt-16 ">
                <button type="button" class="btn btn-submit btn-width" [disabled]="passwordFormGroup.invalid"
                    (click)="changePassword()">Change
                    Password</button>
            </div>
        </form>
    </div>
</div>
