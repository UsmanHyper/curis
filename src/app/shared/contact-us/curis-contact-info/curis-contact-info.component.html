<app-header></app-header>


<section class="pb-64 pt-64">
    <app-curis-contact-form> </app-curis-contact-form>
    <div class="container">
        <div class="row  gx-4 gy-4 row-cols-1 row-cols-md-2 row-cols-xl-3">
            <ng-container *ngFor="let item of cardInfo">
                <div class="col-md-4">
                    <div class="card align-items-center">
                        <div class="card-header">
                            <span class="card-icon">
                                <i class="{{item.icon}} icon-sty"></i>
                            </span>
                        </div>
                        <div class="card-body mt-28 d-grid g-4 ">
                            <h3 class="card-title">{{item.title}}</h3>
                            <p class="card-content">
                                {{item.description}}
                            </p>
                            <p class="card-content link">
                                {{item.link}}
                            </p>
                        </div>
                    </div>
                </div>
            </ng-container>

        </div>

    </div>



</section>


<app-links></app-links>


<app-footer></app-footer>
